schema_version = "1.0.0"

id = "blendyn"
version = "1.2.0"
name = "Blendyn"
tagline = "Import and visualize MBDyn multibody dynamics results"
maintainer = "Andrea Zanoni <andrea.zanoni@polimi.it>"
# Supported types: "add-on", "theme"
type = "add-on"

# Optional: link to documentation, support, source files, etc.
website = "https://github.com/zanoni-mbdyn/blendyn/wiki"

# Optional: tag list defined by Blender and server, see:
# https://docs.blender.org/manual/en/dev/advanced/extensions/tags.html
tags = ["Animation", "Import-Export", "Physics"]

blender_version_min = "4.2.0"
# Optional: Blender version that the extension does not support, earlier versions are supported.
# blender_version_max = "5.1.0"

# License conforming to https://spdx.org/licenses/ (use "SPDX:" prefix)
# https://docs.blender.org/manual/en/dev/advanced/extensions/licenses.html
license = [
  "SPDX:GPL-3.0-or-later",
  "SPDX:MIT",   # logwatcher.py by Giampaolo Rodola'
]

# Required by some licenses. Copyrights must be "Year Name" or "Year-Year Name".
copyright = [
  "2015-2026 Andrea Zanoni",
  "2012 Giampaolo Rodola'",
]

# Supported platforms (required for split-platform builds with wheels).
# https://docs.blender.org/manual/en/dev/advanced/extensions/python_wheels.html#platform-builds
platforms = ["linux-x64", "windows-x64", "macos-x64", "macos-arm64"]

# Bundled Python wheels.
# NetCDF4 (and its dependencies cftime, certifi) are bundled for all
# supported platforms. Build with:  blender --command extension build --split-platforms
# https://docs.blender.org/manual/en/dev/advanced/extensions/python_wheels.html
wheels = [
  # certifi — pure Python, works on all platforms
  "./wheels/certifi-2026.4.22-py3-none-any.whl",
  # cftime — compiled, platform-specific
  "./wheels/cftime-1.6.5-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.whl",
  "./wheels/cftime-1.6.5-cp311-cp311-win_amd64.whl",
  "./wheels/cftime-1.6.5-cp311-cp311-macosx_10_9_x86_64.whl",
  "./wheels/cftime-1.6.5-cp311-cp311-macosx_11_0_arm64.whl",
  # netCDF4 — compiled, platform-specific (bundles HDF5 and netCDF4 C libraries)
  "./wheels/netCDF4-1.7.2-cp311-cp311-manylinux_2_17_x86_64.manylinux2014_x86_64.whl",
  "./wheels/netcdf4-1.7.4-cp311-abi3-win_amd64.whl",
  "./wheels/netCDF4-1.6.5-cp311-cp311-macosx_10_9_x86_64.whl",
  "./wheels/netCDF4-1.6.5-cp311-cp311-macosx_11_0_arm64.whl",
]

# Add-ons can list which resources they will require.
# For each permission it is important to also specify the reason why it is
# required. Keep this a single short sentence without a period (.) at the end.
[permissions]
files = "Import MBDyn output files and optionally run the MBDyn binary"

# Optional: advanced build settings.
[build]
paths_exclude_pattern = [
   "__pycache__/",   # no leading / → matches at any depth
   ".*",             # all hidden dot-files/dirs (covers .git, .github/, etc.)
   "/*.zip",         # root-level zip artifacts
   "/config.json",
   "/tests/",
 ]
